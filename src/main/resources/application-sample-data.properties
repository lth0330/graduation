# Use this profile only when you want to insert/update local demo sample data.
# It runs data.sql without running sql/reset.sql, so existing DB rows are not deleted.

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/sql/sample-schema.sql
spring.sql.init.data-locations=classpath:/sql/data.sql
spring.jpa.defer-datasource-initialization=true
